services:
  rateit:
    build:
      context: .
      args:
        # inlined into the frontend bundle at build time — set it in .env, see .env.example
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: rateit-app
    container_name: rateit
    restart: unless-stopped
    ports:
      - "3000:3000" # change the left side to use a different host port, or drop this once cloudflared is the only way in
    volumes:
      - rateit_data:/app/data # persistent database + uploaded images
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # comma-separated usernames that get admin access automatically
      - ADMIN_USERNAMES=arik_admin

  # Cloudflare Tunnel — exposes rateit publicly without opening any port on the server.
  # Create the tunnel + public hostname in the Cloudflare Zero Trust dashboard
  # (Networks > Tunnels), pointing the hostname at http://rateit:3000, then
  # put the tunnel token in .env as CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rateit-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - rateit

volumes:
  rateit_data:
    driver: local
