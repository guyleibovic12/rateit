services:
  rateit:
    build: .
    image: rateit-app
    container_name: rateit
    restart: unless-stopped
    ports:
      - "3000:3000" # change the left side to use a different host port
    volumes:
      - rateit_data:/app/data # persistent database + uploaded images
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      # comma-separated usernames that get admin access automatically
      - ADMIN_USERNAMES=arik_admin

volumes:
  rateit_data:
    driver: local
